<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 880" width="100%" height="100%" style="background:#0a0e17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818cf8"/>
    </marker>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Header inside SVG -->
  <text x="50" y="30" fill="#f8fafc" font-size="18" font-weight="700">Agentic Blog Researcher &amp; Writer — System Architecture &amp; Workflow</text>
  <text x="750" y="30" fill="#94a3b8" font-size="13" font-family="monospace">LangGraph Map-Reduce • Dynamic Tavily Search • Parallel Worker Nodes • Multimodal Reducer</text>

  <!-- ================= SUB-CONTAINERS ================= -->
  <!-- 1. Client & Delivery Layer -->
  <rect x="40" y="50" width="280" height="800" rx="12" fill="#111827" fill-opacity="0.7" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="60" y="80" fill="#9ca3af" font-size="13" font-weight="700" letter-spacing="1">1. CLIENT &amp; API INTERFACES</text>

  <!-- 2. Phase 1: Planning Core -->
  <rect x="360" y="50" width="340" height="800" rx="12" fill="#111827" fill-opacity="0.7" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="380" y="80" fill="#9ca3af" font-size="13" font-weight="700" letter-spacing="1">2. PHASE 1: PLANNING CORE</text>

  <!-- 3. Phase 2: Parallel Workers -->
  <rect x="740" y="50" width="370" height="800" rx="12" fill="#111827" fill-opacity="0.7" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="760" y="80" fill="#9ca3af" font-size="13" font-weight="700" letter-spacing="1">3. PHASE 2: PARALLEL WORKERS</text>

  <!-- 4. Synthesis & Storage -->
  <rect x="1150" y="50" width="290" height="800" rx="12" fill="#111827" fill-opacity="0.7" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1170" y="80" fill="#9ca3af" font-size="13" font-weight="700" letter-spacing="1">4. SYNTHESIS &amp; PERSISTENCE</text>

  <!-- ================= EDGES ================= -->
  <!-- Streamlit -> Router -->
  <path d="M 270 170 L 320 170 L 320 240 L 410 240" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-emerald)"/>
  <!-- FastAPI -> Router -->
  <path d="M 270 340 L 320 340 L 320 260 L 410 260" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-emerald)"/>

  <!-- Router -> Research (open_book / hybrid) -->
  <path d="M 530 300 L 530 390" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <text x="540" y="350" fill="#fbbf24" font-size="11" font-weight="600" font-family="monospace">open_book / hybrid</text>

  <!-- Router -> Planner (closed_book bypass) -->
  <path d="M 430 300 L 430 580 L 450 580" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-indigo)"/>
  <text x="375" y="440" fill="#9ca3af" font-size="10" font-family="monospace">closed_book</text>

  <!-- Research -> Planner (EvidencePack) -->
  <path d="M 530 480 L 530 550" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="540" y="520" fill="#38bdf8" font-size="11" font-weight="600" font-family="monospace">EvidencePack</text>

  <!-- Tavily -> Research -->
  <path d="M 530 740 L 530 640 L 580 640 L 580 480" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-indigo)"/>

  <!-- Planner -> Fan-Out -->
  <path d="M 650 595 L 755 595" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arr-indigo)"/>
  <text x="690" y="585" fill="#818cf8" font-size="11" font-weight="600" font-family="monospace">Plan.tasks[]</text>

  <!-- Fan-Out -> Workers -->
  <path d="M 785 560 L 785 170 L 820 170" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-purple)"/>
  <path d="M 785 560 L 785 310 L 820 310" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-purple)"/>
  <path d="M 785 595 L 820 595" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-purple)"/>
  <path d="M 785 630 L 785 730 L 820 730" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- Workers -> Reducer (Fan-In) -->
  <path d="M 1060 170 L 1100 170 L 1100 380 L 1180 380" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-purple)"/>
  <path d="M 1060 310 L 1100 310 L 1100 400 L 1180 400" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-purple)"/>
  <path d="M 1060 595 L 1100 595 L 1100 440 L 1180 440" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-purple)"/>
  <path d="M 1060 730 L 1100 730 L 1100 460 L 1180 460" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- Reducer -> Output Markdown -->
  <path d="M 1300 360 L 1300 240" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arr-emerald)"/>
  <text x="1310" y="295" fill="#34d399" font-size="11" font-weight="600" font-family="monospace">final_blog.md</text>

  <!-- Reducer -> Visuals Engine -->
  <path d="M 1300 480 L 1300 560" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="1310" y="525" fill="#fb7185" font-size="11" font-family="monospace">ImagePlan (max 3)</text>


  <!-- ================= NODES ================= -->

  <!-- Streamlit UI -->
  <g filter="url(#glow)">
    <rect x="70" y="120" width="200" height="90" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="85" y="142" fill="#34d399" font-size="10" font-weight="700" font-family="monospace">PORT 8501 • FRONTEND</text>
    <text x="85" y="165" fill="#f8fafc" font-size="14" font-weight="700">Streamlit Dashboard</text>
    <text x="85" y="185" fill="#94a3b8" font-size="11">Interactive GUI &amp; Logs</text>
    <text x="85" y="200" fill="#64748b" font-size="11">app.py</text>
  </g>

  <!-- FastAPI -->
  <g filter="url(#glow)">
    <rect x="70" y="280" width="200" height="90" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="85" y="302" fill="#34d399" font-size="10" font-weight="700" font-family="monospace">PORT 8000 • REST API</text>
    <text x="85" y="325" fill="#f8fafc" font-size="14" font-weight="700">FastAPI Endpoints</text>
    <text x="85" y="345" fill="#94a3b8" font-size="11">/blog/write &amp; /generate</text>
    <text x="85" y="360" fill="#64748b" font-size="11">api.py (CORS Enabled)</text>
  </g>

  <!-- Docker & AWS EC2 -->
  <g filter="url(#glow)">
    <rect x="70" y="450" width="200" height="110" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="85" y="472" fill="#38bdf8" font-size="10" font-weight="700" font-family="monospace">DEPLOYMENT INFRA</text>
    <text x="85" y="495" fill="#f8fafc" font-size="14" font-weight="700">Docker &amp; AWS EC2</text>
    <text x="85" y="515" fill="#94a3b8" font-size="11">t2.micro (1GB + 2GB Swap)</text>
    <text x="85" y="535" fill="#94a3b8" font-size="11">saket0x07/blog-agent:latest</text>
    <text x="85" y="550" fill="#64748b" font-size="10">Dockerfile • DEPLOYMENT_GUIDE</text>
  </g>

  <!-- OverallState -->
  <g filter="url(#glow)">
    <rect x="70" y="640" width="200" height="80" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="85" y="662" fill="#818cf8" font-size="10" font-weight="700" font-family="monospace">TYPED GRAPH STATE</text>
    <text x="85" y="685" fill="#f8fafc" font-size="14" font-weight="700">OverallState Schema</text>
    <text x="85" y="705" fill="#94a3b8" font-size="11">Pydantic &amp; TypedDict</text>
  </g>

  <!-- Router Node -->
  <g filter="url(#glow)">
    <rect x="410" y="210" width="240" height="90" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="425" y="232" fill="#fbbf24" font-size="10" font-weight="700" font-family="monospace">LANGGRAPH NODE 1</text>
    <text x="425" y="255" fill="#f8fafc" font-size="14" font-weight="700">Smart Router Node</text>
    <text x="425" y="275" fill="#94a3b8" font-size="11">Classifies: closed / open / hybrid</text>
    <text x="425" y="290" fill="#64748b" font-size="11">nodes/router.py</text>
  </g>

  <!-- Research Node -->
  <g filter="url(#glow)">
    <rect x="410" y="390" width="240" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="425" y="412" fill="#38bdf8" font-size="10" font-weight="700" font-family="monospace">LANGGRAPH NODE 2</text>
    <text x="425" y="435" fill="#f8fafc" font-size="14" font-weight="700">Dynamic Research Node</text>
    <text x="425" y="455" fill="#94a3b8" font-size="11">Generates 3–10 Web Queries</text>
    <text x="425" y="470" fill="#64748b" font-size="11">nodes/research.py</text>
  </g>

  <!-- Tavily Client -->
  <g filter="url(#glow)">
    <rect x="410" y="740" width="240" height="70" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <text x="425" y="760" fill="#6366f1" font-size="10" font-weight="700" font-family="monospace">EXTERNAL SEARCH TOOL</text>
    <text x="425" y="780" fill="#f8fafc" font-size="14" font-weight="700">Tavily Search API</text>
    <text x="425" y="798" fill="#94a3b8" font-size="11">utils/tavily_client.py (w/ Mock Fallback)</text>
  </g>

  <!-- Planner Node -->
  <g filter="url(#glow)">
    <rect x="410" y="550" width="240" height="90" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="425" y="572" fill="#818cf8" font-size="10" font-weight="700" font-family="monospace">LANGGRAPH NODE 3</text>
    <text x="425" y="595" fill="#f8fafc" font-size="14" font-weight="700">Structured Planner Node</text>
    <text x="425" y="615" fill="#94a3b8" font-size="11">Generates Pydantic PlanObject</text>
    <text x="425" y="630" fill="#64748b" font-size="11">nodes/planner.py</text>
  </g>

  <!-- Fan Out Indicator -->
  <rect x="755" y="555" width="30" height="80" rx="6" fill="#818cf8" stroke="#a5b4fc"/>
  <text x="770" y="600" fill="white" font-size="10" font-weight="bold" text-anchor="middle">FAN OUT</text>

  <!-- Worker 1 -->
  <g filter="url(#glow)">
    <rect x="820" y="125" width="240" height="85" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <text x="835" y="147" fill="#c084fc" font-size="10" font-weight="700" font-family="monospace">PARALLEL WORKER 1</text>
    <text x="835" y="170" fill="#f8fafc" font-size="14" font-weight="700">Section: Intro &amp; Context</text>
    <text x="835" y="190" fill="#94a3b8" font-size="11">Concurrent Section Drafting</text>
    <text x="835" y="203" fill="#64748b" font-size="10">nodes/worker.py</text>
  </g>

  <!-- Worker 2 -->
  <g filter="url(#glow)">
    <rect x="820" y="265" width="240" height="85" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <text x="835" y="287" fill="#c084fc" font-size="10" font-weight="700" font-family="monospace">PARALLEL WORKER 2</text>
    <text x="835" y="310" fill="#f8fafc" font-size="14" font-weight="700">Section: Architecture &amp; Mech</text>
    <text x="835" y="330" fill="#94a3b8" font-size="11">Concurrent Section Drafting</text>
    <text x="835" y="343" fill="#64748b" font-size="10">nodes/worker.py</text>
  </g>

  <!-- Worker 3 -->
  <g filter="url(#glow)">
    <rect x="820" y="550" width="240" height="85" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <text x="835" y="572" fill="#c084fc" font-size="10" font-weight="700" font-family="monospace">PARALLEL WORKER 3</text>
    <text x="835" y="595" fill="#f8fafc" font-size="14" font-weight="700">Section: Practical Code</text>
    <text x="835" y="615" fill="#94a3b8" font-size="11">Concurrent Section Drafting</text>
    <text x="835" y="628" fill="#64748b" font-size="10">nodes/worker.py</text>
  </g>

  <!-- Worker 4 -->
  <g filter="url(#glow)">
    <rect x="820" y="690" width="240" height="85" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <text x="835" y="712" fill="#c084fc" font-size="10" font-weight="700" font-family="monospace">PARALLEL WORKER 4</text>
    <text x="835" y="735" fill="#f8fafc" font-size="14" font-weight="700">Section: Best Practices</text>
    <text x="835" y="755" fill="#94a3b8" font-size="11">Concurrent Section Drafting</text>
    <text x="835" y="768" fill="#64748b" font-size="10">nodes/worker.py</text>
  </g>

  <!-- Multimodal Reducer -->
  <g filter="url(#glow)">
    <rect x="1180" y="360" width="230" height="120" rx="10" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
    <text x="1195" y="385" fill="#fb7185" font-size="10" font-weight="700" font-family="monospace">LANGGRAPH REDUCER</text>
    <text x="1195" y="410" fill="#f8fafc" font-size="14" font-weight="700">Multimodal Reducer</text>
    <text x="1195" y="430" fill="#94a3b8" font-size="11">1. Sequential Draft Stitching</text>
    <text x="1195" y="448" fill="#94a3b8" font-size="11">2. ImagePlan (1–3 Images)</text>
    <text x="1195" y="466" fill="#64748b" font-size="10">nodes/reducer.py</text>
  </g>

  <!-- Markdown Output -->
  <g filter="url(#glow)">
    <rect x="1180" y="150" width="230" height="90" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="1195" y="172" fill="#34d399" font-size="10" font-weight="700" font-family="monospace">FINAL DELIVERABLE</text>
    <text x="1195" y="195" fill="#f8fafc" font-size="14" font-weight="700">Markdown Blog Artifact</text>
    <text x="1195" y="215" fill="#94a3b8" font-size="11">Illustrated technical post</text>
    <text x="1195" y="230" fill="#64748b" font-size="10">output/*.md</text>
  </g>

  <!-- Image Generation Engines -->
  <g filter="url(#glow)">
    <rect x="1180" y="560" width="230" height="150" rx="10" fill="#0f172a" stroke="#fb7185" stroke-width="2"/>
    <text x="1195" y="582" fill="#fb7185" font-size="10" font-weight="700" font-family="monospace">MULTIMODAL ENGINE</text>
    <text x="1195" y="605" fill="#f8fafc" font-size="14" font-weight="700">Visual Generation</text>
    <text x="1195" y="628" fill="#94a3b8" font-size="11">1. Google Gemini (Imagen 3)</text>
    <text x="1195" y="646" fill="#94a3b8" font-size="11">2. HuggingFace FLUX.1</text>
    <text x="1195" y="664" fill="#94a3b8" font-size="11">3. Pillow Local Fallback</text>
    <text x="1195" y="692" fill="#64748b" font-size="10">utils/image_generator.py</text>
  </g>
</svg>
